<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MediCore HMS - A comprehensive Hospital Management System for managing patients, doctors, appointments, prescriptions, and billing." />
  <title>MediCore HMS — Hospital Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div id="confirm-dialog" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal confirm-modal">
      <div class="confirm-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <h3 id="confirm-title">Confirm Action</h3>
      <p id="confirm-message">Are you sure you want to proceed?</p>
      <div class="confirm-actions">
        <button id="confirm-cancel-btn" class="btn btn-outline">Cancel</button>
        <button id="confirm-ok-btn" class="btn btn-danger">Confirm</button>
      </div>
    </div>
  </div>
  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <div class="loading-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </div>
      <h1>MediCore HMS</h1>
      <p>Initializing system...</p>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>
  </div>
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-bg">
      <div class="auth-bg-shape shape-1"></div>
      <div class="auth-bg-shape shape-2"></div>
      <div class="auth-bg-shape shape-3"></div>
    </div>
    <div class="auth-container">
      <div class="auth-brand">
        <div class="auth-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        </div>
        <div>
          <h1>MediCore HMS</h1>
          <p>Hospital Management System</p>
        </div>
      </div>
      <div id="login-form-container" class="auth-card">
        <h2>Welcome back</h2>
        <p class="auth-subtitle">Sign in to your account</p>
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-username">Username or Email</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="login-username" placeholder="Enter username or email" autocomplete="username" />
            </div>
            <span class="field-error" id="login-username-error"></span>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" />
              <button type="button" id="toggle-password" class="input-icon-btn" aria-label="Toggle password visibility">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <span class="field-error" id="login-password-error"></span>
          </div>
          <div id="login-error" class="alert alert-danger hidden"></div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-submit-btn">
            <span class="btn-text">Sign In</span>
            <span class="btn-spinner hidden"></span>
          </button>
        </form>
        <div class="auth-demo-accounts">
          <p class="demo-label">Demo Accounts (click to fill)</p>
          <div class="demo-grid">
            <button class="demo-btn" data-username="admin" data-password="admin123">Admin</button>
            <button class="demo-btn" data-username="dr.smith" data-password="doctor123">Doctor</button>
            <button class="demo-btn" data-username="reception" data-password="recep123">Receptionist</button>
            <button class="demo-btn" data-username="patient1" data-password="patient123">Patient</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="app-shell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        </div>
        <span class="sidebar-brand">MediCore</span>
        <button id="sidebar-collapse-btn" class="sidebar-collapse-btn" aria-label="Collapse sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebar-user">
          <div class="sidebar-avatar" id="sidebar-avatar">A</div>
          <div class="sidebar-user-info">
            <span class="sidebar-user-name" id="sidebar-user-name">Admin User</span>
            <span class="sidebar-user-role" id="sidebar-user-role">Administrator</span>
          </div>
        </div>
        <button id="logout-btn" class="sidebar-logout-btn" aria-label="Logout">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>
    <div class="main-wrapper">
      <header class="topnav" id="topnav">
        <div class="topnav-left">
          <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Open menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="topnav-breadcrumb">
            <span id="page-title">Dashboard</span>
          </div>
        </div>
        <div class="topnav-right">
          <div class="topnav-search">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="global-search" placeholder="Quick search..." aria-label="Global search" />
          </div>
          <button class="topnav-icon-btn notification-btn" id="notification-btn" aria-label="Notifications">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
            <span class="notification-badge" id="notification-badge">3</span>
          </button>
          <div class="topnav-avatar" id="topnav-avatar">A</div>
        </div>
      </header>
      <main class="page-content" id="page-content"></main>
    </div>
    <div id="mobile-overlay" class="mobile-overlay hidden"></div>
  </div>
  <div id="modal-container" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal" id="modal-inner">
      <div class="modal-header">
        <h3 id="modal-title">Modal Title</h3>
        <button id="modal-close-btn" class="modal-close-btn" aria-label="Close modal">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/patients.js"></script>
  <script src="js/pages/doctors.js"></script>
  <script src="js/pages/departments.js"></script>
  <script src="js/pages/appointments.js"></script>
  <script src="js/pages/medical-records.js"></script>
  <script src="js/pages/prescriptions.js"></script>
  <script src="js/pages/billing.js"></script>
  <script src="js/pages/users.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
